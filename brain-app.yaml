# The Quantum Room — brain-app manifest
#
# An interactive instrument for understanding quantum mechanics. Installs into
# a brain via the Apps page (paste this repo's public GitHub URL -> Approve).
#
# Schema: brain-app/v1 — api/schemas/brain-app.schema.json in brainfoundry-nous.
# Created: 2026-05-19. v0.2.0 brain-bridge wiring: 2026-05-20.
#
# v0.4.0 (2026-06-21): the Bloch sphere now draws all three measurement axes —
#   X (|+⟩,|−⟩) and Y (|+i⟩,|−i⟩) alongside the Z poles (|0⟩,|1⟩) — and adds a
#   "three axes" read-further concept (plain language down to mutually-unbiased
#   bases and SU(2)/SO(3)). Axes show in the Qubit and Measurement rooms.
#
# v0.2.0 wires the postMessage bridge:
#   * "Ask the brain" sends current context (room, concept, depth, qubit state,
#     concepts explored) via the llm.complete intent. The brain answers over
#     its ingested curriculum (semantic layer) with the operator BYOK model.
#   * Reading a concept appends an event to episodic memory so the brain
#     remembers what the user has explored — side-chat answers reflect it,
#     and the trail persists across sessions.
# Standalone (not iframed) the app still runs fully; only the side-chat and
# brain-side persistence go quiet.

dialect: brain-app/v1
id: quantum-room
name: The Quantum Room
version: 0.4.0
description: An interactive instrument for understanding quantum mechanics — five rooms, a concept map, and layered read-further explanations from plain language to real physics.
license: AGPL-3.0

author:
  name: hbar
  url: https://hbar.systems
  contact: hello@hbar.systems

repo: https://github.com/hbar-systems/hbar-university-quantum-room

tab:
  label: Quantum
  route: /quantum
  order: 100

entries:
  ui_bundle: bundle/

permissions:
  - llm.invoke
  - memory.write

requires_layers:
  - layer: semantic
    mode: read
  - layer: episodic
    mode: append

requires_endpoints:
  - POST /chat/rag
  - POST /memory/append

engines:
  brainfoundry-nous: ">=0.8.4"
